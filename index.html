<!doctype html>
<html lang="id" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIPMEDIA — School Media System</title>

  <!-- Font (opsional): bila gagal dimuat, tampilan memakai font sistem -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">

  <!-- Terapkan tema tersimpan sebelum halaman tampil (mencegah kedipan terang → gelap) -->
  <script>
    try { if (localStorage.getItem('sipmedia_theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
  </script>
</head>
<body data-view="app">

  <nav id="sidebar" class="sidebar" aria-label="Menu utama">
    <div class="sidebar-header">
      <div class="app-logo"><i class="bi bi-camera-reels"></i></div>
      <div>
        <h5 id="appTitle">SIPMEDIA</h5>
        <span class="sidebar-tagline">School Media System</span>
      </div>
    </div>
    <ul id="sidebarNav" class="sidebar-nav"><!-- diisi oleh app.js sesuai peran --></ul>
    <div class="sidebar-footer">
      <label class="switch" for="darkModeToggle">
        <input type="checkbox" id="darkModeToggle"> <i class="bi bi-moon-stars"></i> Mode Gelap
      </label>
      <button type="button" class="nav-logout" id="btnLogout"><i class="bi bi-box-arrow-left"></i> <span>Keluar</span></button>
    </div>
  </nav>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <main class="main-content">
    <div class="topbar">
      <button class="icon-btn menu-toggle" id="btnMenu" type="button" aria-label="Buka menu"><i class="bi bi-list"></i></button>
      <div class="topbar-search"><i class="bi bi-search"></i><input type="text" placeholder="Cari peminjaman, aset..." id="globalSearch" aria-label="Cari"></div>
      <div class="topbar-right">
        <button class="icon-btn" type="button" aria-label="Notifikasi"><i class="bi bi-bell"></i><span class="notif-dot"></span></button>
        <div class="user-chip">
          <div class="avatar" id="userAvatar">--</div>
          <div class="user-meta">
            <div class="user-name" id="userName">-</div>
            <span class="role-badge" id="userRoleBadge">-</span>
          </div>
        </div>
      </div>
    </div>

    <div id="page-root" aria-live="polite"></div>
  </main>

  <div class="loading-overlay" id="loading" role="status" aria-label="Memuat"><div class="spinner"></div></div>
  <div class="toast" id="notif" role="alert"></div>

  <!-- Urutan penting: config → api → ui → router → halaman → app -->
  <script src="vendor/chart.umd.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/router.js"></script>
  <script src="js/pages/masuk.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/booking.js"></script>
  <script src="js/pages/schedule.js"></script>
  <script src="js/pages/approval.js"></script>
  <script src="js/pages/history.js"></script>
  <script src="js/pages/analytics.js"></script>
  <script src="js/pages/masterdata.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
